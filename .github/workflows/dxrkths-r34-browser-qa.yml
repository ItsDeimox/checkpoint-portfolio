name: Validate DXRKTHS R34 modal metadata alignment in Chromium
on:
  push:
    branches: [dxrkths-r34-browser-qa]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test DXRKTHS
        working-directory: dxrkths
        run: npm ci && npm run build
      - name: Install browser test dependency
        working-directory: dxrkths
        run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Verify metadata underneath media, no repeats, all galleries and mobile layouts
        working-directory: dxrkths
        env:
          DXT_QA_OUT: docs/r34-qa
        run: node tests/project-content-r32-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r34-browser-evidence
          path: dxrkths/docs/r34-qa/
          retention-days: 7
