name: Measure and verify DXRKTHS Low mobile profile
on:
  push:
    branches: [dxrkths-r37-low-mobile]
permissions:
  contents: write
jobs:
  low-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: dxrkths
      - name: Install locked dependencies and isolated browser driver
        working-directory: dxrkths
        run: npm ci && npm install --no-save --package-lock=false playwright@1.56.1 && npm run bundle
      - name: Measure actual unmodified Low scene
        working-directory: dxrkths
        env:
          BASELINE: '1'
          DXT_QA_OUT: /tmp/dxt-r37/baseline
        run: node tests/low-mobile-r37-browser.cjs
      - name: Apply reviewed exact-match source and regression changes
        run: |
          python dxrkths/tools/r37-apply.py
          python dxrkths/tools/r37-tests.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('dxrkths')
          for path,wanted in json.loads((root/'tools/r37-source-hashes.json').read_text()).items():
              actual=hashlib.sha256((root/path).read_bytes()).hexdigest()
              assert actual==wanted,(path,actual,wanted)
          print('All sixteen source files match the locally validated implementation')
          PY
      - name: Build with all current regression tests
        working-directory: dxrkths
        run: npm run build
      - name: Save verified source on isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dxrkths/src dxrkths/tests
          git restore --staged dxrkths/src/render/showroom.bundle.js
          git commit -m 'perf(dxrkths): apply verified lightweight profile and lifecycle regressions [r37 applied]'
          git push origin HEAD:dxrkths-r37-low-mobile
      - name: Verify Low sleep, touch, portal and High quality restoration
        working-directory: dxrkths
        env:
          DXT_QA_OUT: /tmp/dxt-r37/optimized
        run: node tests/low-mobile-r37-browser.cjs
      - name: Replay all existing mobile routes and touch checks
        working-directory: dxrkths
        env:
          DXT_QA_OUT: /tmp/dxt-r37/mobile
        run: node tests/mobile-r35-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r37-low-evidence
          path: /tmp/dxt-r37/
          retention-days: 7
