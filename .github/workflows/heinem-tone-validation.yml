name: HEINEM tone comparison
on:
  push:
    branches: [heinem/cool-tone-validation]
permissions:
  contents: read
concurrency:
  group: heinem-tone-validation
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: heinem/package-lock.json
      - run: npm ci
        working-directory: heinem
      - run: npm run build
        working-directory: heinem
      - name: Verify grading in the runner's installed Chrome
        working-directory: heinem
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CI: '1'
        run: npx playwright test tests/browser/scene-grade.spec.ts tests/browser/scene-finish.spec.ts
      - name: Capture actual composition before and after the finish
        working-directory: heinem
        run: |
          mkdir -p tone-evidence
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/heinem-vite.log 2>&1 &
          cat > tone-evidence/capture.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page = await browser.newPage({viewport:{width:1440,height:810},reducedMotion:'reduce'});
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173');
          await page.evaluate(async()=>{await document.fonts.ready;await Promise.all([...document.querySelectorAll('img[src]')].map(i=>i.decode().catch(()=>{})));});
          await page.locator('#quality-button').click();
          await page.locator('[data-quality="high"]').click();
          await page.waitForTimeout(1500);
          await page.evaluate(()=>{document.querySelector('#scene-world').dataset.colorFinish='off';scrollTo({top:0,behavior:'instant'});});
          await page.screenshot({path:'tone-evidence/hero-before.png'});
          await page.evaluate(()=>document.querySelector('#music').scrollIntoView({behavior:'instant'}));
          await page.waitForTimeout(250);
          await page.screenshot({path:'tone-evidence/music-before.png'});
          await page.evaluate(()=>document.querySelector('#scene-world').dataset.colorFinish='cool');
          await page.screenshot({path:'tone-evidence/music-after.png'});
          await page.evaluate(()=>scrollTo({top:0,behavior:'instant'}));
          await page.waitForTimeout(250);
          await page.screenshot({path:'tone-evidence/hero-after.png'});
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(600);
          await page.screenshot({path:'tone-evidence/mobile-after.png'});
          writeFileSync('tone-evidence/runtime.json',JSON.stringify({errors,browser:browser.version(),grade:[1.06,-.06,1.04,-.04,.98,.02]},null,2));
          await browser.close();
          if(errors.length) throw new Error(errors.join('\n'));
          JS
          node tone-evidence/capture.mjs
      - name: Pack app for isolated offline verification
        if: always()
        run: |
          mkdir -p heinem/tone-evidence
          tar --exclude='heinem/node_modules' --exclude='heinem/.git' --exclude='heinem/docs/evidence' --exclude='heinem/tone-evidence' --exclude='heinem/test-results' -czf heinem/tone-evidence/heinem-source.tar.gz heinem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heinem-tone-comparison
          path: |
            heinem/tone-evidence/
            heinem/test-results/
          retention-days: 3
