name: HEINEM tone comparison
on:
  push:
    branches: [heinem/cool-tone-validation]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: heinem/package-lock.json
      - run: npm ci
        working-directory: heinem
      - run: npx playwright install --with-deps chromium
        working-directory: heinem
      - name: Capture actual composition before and after the finish
        working-directory: heinem
        run: |
          mkdir -p tone-evidence
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/heinem-vite.log 2>&1 &
          cat > tone-evidence/capture.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch({args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page = await browser.newPage({viewport:{width:1440,height:810},reducedMotion:'reduce'});
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173');
          await page.evaluate(async()=>{await document.fonts.ready;await Promise.all([...document.querySelectorAll('img[src]')].map(i=>i.decode().catch(()=>{})));});
          await page.locator('#quality-button').click();
          await page.locator('[data-quality="high"]').click();
          await page.waitForTimeout(1500);
          await page.evaluate(()=>scrollTo({top:0,behavior:'instant'}));
          await page.screenshot({path:'tone-evidence/hero-before.png'});
          await page.evaluate(()=>document.querySelector('#music').scrollIntoView({behavior:'instant'}));
          await page.waitForTimeout(250);
          await page.screenshot({path:'tone-evidence/music-before.png'});
          await page.evaluate(()=>{
            document.body.insertAdjacentHTML('afterbegin', '<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="garden-cool-finish" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="1.06 0 0 0 -0.06 0 1.04 0 0 -0.04 0 0 0.98 0 0.02 0 0 0 1 0"/></filter></defs></svg>');
            const style=document.createElement('style');
            style.textContent='.sky{filter:var(--garden-sky-grade) url("#garden-cool-finish")!important}.distant-foliage,.mid-foliage,.left-tree{filter:var(--garden-foliage-grade) url("#garden-cool-finish")!important}.scene-layer.foreground{filter:var(--garden-foreground-grade) url("#garden-cool-finish")!important}#bubble-canvas{filter:url("#garden-cool-finish")!important}';
            document.head.append(style);
          });
          await page.screenshot({path:'tone-evidence/music-after.png'});
          await page.evaluate(()=>scrollTo({top:0,behavior:'instant'}));
          await page.waitForTimeout(250);
          await page.screenshot({path:'tone-evidence/hero-after.png'});
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(600);
          await page.screenshot({path:'tone-evidence/mobile-after.png'});
          writeFileSync('tone-evidence/runtime.json',JSON.stringify({errors,browser:browser.version(),source:'8f2acd31d80153767db1d63462beeb1a13dc1585',grade:[1.06,-.06,1.04,-.04,.98,.02]},null,2));
          await browser.close();
          if(errors.length) throw new Error(errors.join('\n'));
          JS
          node tone-evidence/capture.mjs
      - name: Pack app source for isolated offline verification
        run: |
          tar --exclude='heinem/node_modules' --exclude='heinem/.git' --exclude='heinem/docs/evidence' --exclude='heinem/tone-evidence' --exclude='heinem/test-results' -czf heinem/tone-evidence/heinem-source.tar.gz heinem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heinem-tone-comparison
          path: heinem/tone-evidence/
          retention-days: 3
