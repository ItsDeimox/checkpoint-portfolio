name: Verify DXT physical portal exit
on:
  push:
    branches: [build/dxt-portal-end-r20]
permissions:
  contents: write
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/r20-live-tools --no-audit --no-fund playwright@1.56.1
          /tmp/r20-live-tools/node_modules/.bin/playwright install --with-deps chromium >/tmp/browser-install.txt
      - name: Verify published files and the live camera-driven transition
        run: NODE_PATH=/tmp/r20-live-tools/node_modules node .github/r20-live.cjs
      - name: Record production check without modifying production source
        run: |
          git config user.name 'Deimox'
          git config user.email '123704758+ItsDeimox@users.noreply.github.com'
          git add dxrkths/docs/r20/live-check.json
          git commit -m 'Confirm live DXT exit zoom and published build integrity [skip ci]'
          git push origin HEAD:refs/heads/build/dxt-portal-end-r20
