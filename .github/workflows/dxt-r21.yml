name: DXT portal perspective and performance checks
on:
  push:
    branches: [build/dxt-portal-wall-r21]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          cd dxrkths
          npm ci --no-audit --no-fund
          npm install --prefix /tmp/dxt-browser --no-audit --no-fund playwright sharp
          /tmp/dxt-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate current source
        run: |
          python3 .r21/finalize.py
          cd dxrkths
          set +e
          npm run build >docs/r21-diagnostics/build.txt 2>&1
          code=$?
          grep -A26 '^not ok' docs/r21-diagnostics/build.txt >docs/r21-diagnostics/failures.txt
          tail -15 docs/r21-diagnostics/build.txt
          cat docs/r21-diagnostics/failures.txt
          exit "$code"
      - name: Check physical wall in both directions
        run: |
          cd dxrkths
          node tools/server.mjs --host 0.0.0.0 --port 3000 >/tmp/site.log 2>&1 &
          NODE_PATH=/tmp/dxt-browser/node_modules node tests/portal-wall-browser.cjs >docs/r21-diagnostics/wall-browser-output.txt 2>&1
      - name: Compact result summary
        if: always()
        run: |
          cd dxrkths
          node - <<'JS'
          const fs=require('fs');if(fs.existsSync('docs/r21-diagnostics/wall-browser.json')){const r=JSON.parse(fs.readFileSync('docs/r21-diagnostics/wall-browser.json'));const s={checks:r.checks.length,failed:r.checks.filter(x=>!x.pass),error:r.error,errors:r.errors,native:r.native?{frames:r.native.frames.length,tasks:r.native.tasks}:null};fs.writeFileSync('docs/r21-diagnostics/summary.json',JSON.stringify(s,null,2));console.log(JSON.stringify(s));}
          JS
      - name: Retain exact source and diagnostics only on working branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Deimox'
          git config user.email '123704758+ItsDeimox@users.noreply.github.com'
          git add dxrkths/src/scene/room-portal-exit.js dxrkths/src/scene/room-portal-shader.js dxrkths/src/scene/room-portal.js dxrkths/src/scene/room-portal-scene.js dxrkths/src/scene/room-scene.js dxrkths/src/ui/portal-arrival.js dxrkths/src/ui/room-section-routes.js dxrkths/src/styles-sections.css dxrkths/tools/build.mjs dxrkths/tests dxrkths/docs/r21-diagnostics
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record symmetric wall return and visual validation [skip ci]'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/build/dxt-portal-wall-r21
