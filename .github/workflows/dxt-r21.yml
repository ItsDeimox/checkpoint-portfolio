name: DXT portal perspective and performance checks
on:
  push:
    branches: [build/dxt-portal-wall-r21]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          cd dxrkths
          npm ci --no-audit --no-fund
          npm install --prefix /tmp/dxt-browser --no-audit --no-fund playwright sharp
          /tmp/dxt-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Red then green regressions
        run: |
          cd dxrkths
          mkdir -p docs/r21-diagnostics
          set +e
          node --test tests/portal-wall.test.mjs >docs/r21-diagnostics/red.txt 2>&1
          red=$?
          set -e
          if [ "$red" = 0 ]; then echo 'Expected baseline tests to fail'; exit 1; fi
          cd ..
          python3 .r21/patch.py
          cd dxrkths
          npm run build >docs/r21-diagnostics/build.txt 2>&1
      - name: Measure actual rendered paths
        run: |
          cd dxrkths
          node tools/server.mjs --host 0.0.0.0 --port 3000 >/tmp/site.log 2>&1 &
          sed -e 's/baseline-/after-/g' -e 's/baseline.json/after.json/g' -e 's/1.05+t\*1.15/1.05+t*2.05/g' tests/r21-probe.cjs >tests/r21-probe-after.cjs
          NODE_PATH=/tmp/dxt-browser/node_modules node tests/r21-probe-after.cjs
          rm tests/r21-probe-after.cjs
      - name: Retain exact tested changes only on the working branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Deimox'
          git config user.email '123704758+ItsDeimox@users.noreply.github.com'
          git add dxrkths/src/scene/room-portal-exit.js dxrkths/src/scene/room-portal-shader.js dxrkths/src/scene/room-portal.js dxrkths/src/scene/room-portal-scene.js dxrkths/src/scene/room-scene.js dxrkths/src/ui/portal-arrival.js dxrkths/src/ui/room-section-routes.js dxrkths/src/styles-sections.css dxrkths/tools/build.mjs dxrkths/tests dxrkths/docs/r21-diagnostics
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record physical-wall implementation and test results [skip ci]'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/build/dxt-portal-wall-r21
