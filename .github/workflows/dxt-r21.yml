name: DXT fresh-session native performance comparison
on:
  push:
    branches: [build/dxt-portal-wall-r21]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact existing source
        run: |
          cd dxrkths
          npm ci --no-audit --no-fund
          npm run bundle
          npm install --prefix /tmp/dxt-browser --no-audit --no-fund playwright
          /tmp/dxt-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Compare fresh native entry and return without resize stress
        run: |
          cd dxrkths
          node tools/server.mjs --host 0.0.0.0 --port 3000 >/tmp/site.log 2>&1 &
          cd ..
          NODE_PATH=/tmp/dxt-browser/node_modules node .r21/fresh-native.cjs
      - name: Retain measured result only on working branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Deimox'
          git config user.email '123704758+ItsDeimox@users.noreply.github.com'
          git add dxrkths/docs/r21-diagnostics/fresh-native.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record fresh-session native portal performance [skip ci]'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/build/dxt-portal-wall-r21
