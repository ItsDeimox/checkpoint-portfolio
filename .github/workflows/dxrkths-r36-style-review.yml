name: Review DXRKTHS mobile showroom design
on:
  push:
    branches: [dxrkths-r36-showroom-style]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: dxrkths
          persist-credentials: false
      - name: Build and run the complete regression suite
        working-directory: dxrkths
        run: npm ci && npm run build
      - name: Prepare system Chrome automation
        working-directory: dxrkths
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Review actual showroom composition and touch geometry
        working-directory: dxrkths
        env:
          DXT_QA_OUT: docs/r36-style-qa
        run: node tests/mobile-style-r36-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r36-design-review
          path: dxrkths/docs/r36-style-qa/
          retention-days: 7
      - name: Preserve the full mobile navigation and destination audit
        working-directory: dxrkths
        env:
          DXT_QA_OUT: docs/r36-interaction-qa
        run: node tests/mobile-r35-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r36-interaction-review
          path: dxrkths/docs/r36-interaction-qa/
          retention-days: 7
