name: Stage verified DXT perspective refinement
on:
  push:
    branches: [build/dxt-perspective-r3-20261009]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Import the hash-verified source
        env:
          SOURCE_URL: https://sb-6t4sa0kwpbtb.vercel.run/import-package.tar.gz
          SOURCE_SHA256: c9a7b2de5b06be16ef3894e9585f5eb86b99240f7e68e67850ae28f051ac541c
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin https://github.com/ItsDeimox/checkpoint-portfolio.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -b build/dxt-perspective-r3-20261009 FETCH_HEAD
          curl --fail --location --retry 2 "$SOURCE_URL" -o /tmp/dxt.tar.gz
          echo "$SOURCE_SHA256  /tmp/dxt.tar.gz" | sha256sum -c -
          rm -rf dxrkths
          mkdir dxrkths
          tar -xzf /tmp/dxt.tar.gz -C dxrkths
          cd dxrkths
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Store source on the isolated integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd work
          git config user.name 'Deimox'
          git config user.email '123704758+ItsDeimox@users.noreply.github.com'
          git add dxrkths
          git commit -m 'Stage DXT perspective, optical cards and reference lighting [skip ci]'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/build/dxt-perspective-r3-20261009
