name: Confirm DXRKTHS Low mobile optimization and all routes
on:
  push:
    branches: [dxrkths-r37-low-confirm]
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: dxrkths
      - name: Apply breakpoint regression and atomic image decode assertion
        run: |
          python dxrkths/tools/r37-confirm.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dxrkths/src/scene/room-scene.js dxrkths/tests/low-mobile-r37.test.mjs dxrkths/tests/mobile-r35-browser.cjs
          git commit -m 'fix(dxrkths): preserve large-touch projection and atomic mobile image QA [r37 confirmed]'
          git push origin HEAD:dxrkths-r37-low-confirm
      - name: Build and execute every regression
        working-directory: dxrkths
        run: npm ci && npm run build && npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify reduced GPU work, idle sleep, interactions and quality restoration
        working-directory: dxrkths
        env:
          DXT_QA_OUT: /tmp/dxt-r37/optimized
        run: node tests/low-mobile-r37-browser.cjs
      - name: Exercise all mobile destinations, galleries, dialogs and orientations
        working-directory: dxrkths
        env:
          DXT_QA_OUT: /tmp/dxt-r37/mobile
        run: node tests/mobile-r35-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r37-confirmed
          path: /tmp/dxt-r37/
          retention-days: 7
