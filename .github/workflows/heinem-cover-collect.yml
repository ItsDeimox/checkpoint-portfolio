name: Collect verified HEINEM artwork locally
on:
  push:
    branches: [heinem/cover-source-verification]
    paths: ['.github/workflows/heinem-cover-collect.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download official release cover art (one-off verification branch)
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.parse
          from urllib.error import HTTPError
          tracks={
            "dont-let-me-fall":"https://soundcloud.com/heinemstrange/dont-let-me-fall",
            "her-heinem-flip":"https://soundcloud.com/heinemstrange/jvke-her-feat-annika-wells",
            "seven-lions-free-heinem-remix":"https://soundcloud.com/heinemstrange/seven-lions-brieanna-grace",
          }
          root=pathlib.Path("heinem/public/assets/soundcloud")
          root.mkdir(parents=True,exist_ok=True)
          for name,permalink in tracks.items():
            metadata="https://soundcloud.com/oembed?"+urllib.parse.urlencode({"format":"json","url":permalink})
            with urllib.request.urlopen(urllib.request.Request(metadata,headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as response:
              data=json.load(response)
            url=urllib.parse.urlparse(data.get("thumbnail_url",""))
            if data.get("provider_name")!="SoundCloud" or url.scheme!="https" or url.netloc!="i1.sndcdn.com" or not url.path.startswith("/artworks-"):
              raise RuntimeError("Invalid artwork source for "+name)
            urls=["https://i1.sndcdn.com"+url.path.replace("-t500x500.", "-t1080x1080."),url.geturl()]
            content=None
            for candidate in urls:
              try:
                with urllib.request.urlopen(urllib.request.Request(candidate,headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as response:
                  chunk=response.read(3_000_001)
                if len(chunk)>3_000_000 or not chunk.startswith(bytes([255,216,255])):
                  continue
                content=chunk
                break
              except HTTPError:
                pass
            if not content:
              raise RuntimeError("No valid JPEG image for "+name)
            dest=root/(name+".jpg")
            dest.write_bytes(content)
            print(json.dumps({"name":name,"source":url.geturl(),"bytes":len(content),"path":str(dest)}))
          PY
      - name: Commit downloaded JPEG files to verification branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heinem/public/assets/soundcloud/*.jpg
          git commit -m "assets(heinem): store three verified artist SoundCloud covers"
          git push origin HEAD:heinem/cover-source-verification
