name: Inspect actual DXRKTHS mobile layouts
on:
  push:
    branches: [dxrkths-r35-mobile-probe]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: dxrkths
      - name: Build baseline
        working-directory: dxrkths
        run: npm ci && npm run build
      - name: Prepare browser
        working-directory: dxrkths
        run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Inspect real pages with touch and narrow viewports
        working-directory: dxrkths
        run: node tests/mobile-r35-probe.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r35-mobile-baseline-evidence
          path: dxrkths/docs/r35-mobile-baseline/
          retention-days: 7
