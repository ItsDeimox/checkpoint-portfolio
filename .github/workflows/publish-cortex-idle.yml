name: Publish Cortex Idle Windows executable
on:
  push:
    branches: [cortex-idle-releases]
    paths: ['.github/workflows/publish-cortex-idle.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Cortex Idle artifact
        env:
          RELEASE_ARCHIVE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6d48-820e-a8ee-786c1fcd29a9/raw?se=2026-10-11T07%3A16%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=f1795a53-b5dd-5139-be6a-dff5226a52c8&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A26%3A36Z&ske=2026-10-11T23%3A26%3A36Z&sks=b&skv=2026-02-06&sig=iU330KvP3nnMrs/IgEYeiXTQ/1HnDhJRC6eI2s3Ke48%3D'
        run: |
          curl --fail --location --show-error --retry 3 --retry-delay 2 "$RELEASE_ARCHIVE_URL" --output /tmp/cortex-idle-artifact.zip
          unzip -oq /tmp/cortex-idle-artifact.zip -d /tmp/cortex-idle-release
          test -f /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe
          echo 'f2af4a0e7e0cc3e62a75ae081eea2e453f1398dcc025267b0c2f40c476cbaa65  /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe' | sha256sum -c -
          test "$(stat -c%s /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe)" -eq 117758427
          file /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe | grep -q 'PE32'
      - name: Update existing public Windows download (no duplicate release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload cortex-idle-v0.1.0-halloween /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit cortex-idle-v0.1.0-halloween \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Cortex Idle portable Windows x64 with per-world playtime tracking, including background sessions and legacy migration, compiled from private ItsDeimox/cortex-idle commit 471207af33222667b1ba7dd29708c29987e3a191. SHA-256: f2af4a0e7e0cc3e62a75ae081eea2e453f1398dcc025267b0c2f40c476cbaa65. Size: 117758427 bytes. No installer required."
          gh release view cortex-idle-v0.1.0-halloween --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "Cortex-Idle-0.1.0-Windows.exe") | .size'
