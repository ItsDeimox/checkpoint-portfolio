name: Publish Cortex Idle Windows executable
on:
  push:
    branches: [cortex-idle-releases]
    paths: ['.github/workflows/publish-cortex-idle.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Cortex Idle artifact
        env:
          RELEASE_ARCHIVE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-946c-81f5-a642-6d1f633b8672/raw?se=2026-10-11T09%3A23%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=b15aed84-1dbc-5ba5-88d8-200e21cbb9fb&skoid=434ec24f-a0f0-4e64-b0de-2e2053f69735&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A26%3A23Z&ske=2026-10-11T23%3A26%3A23Z&sks=b&skv=2026-02-06&sig=tH66m%2BgKCz9HKycqXO5QeR12XUI3Z3cg2jd035OSFfo%3D'
        run: |
          curl --fail --location --show-error --retry 3 --retry-delay 2 "$RELEASE_ARCHIVE_URL" --output /tmp/cortex-idle-artifact.zip
          unzip -oq /tmp/cortex-idle-artifact.zip -d /tmp/cortex-idle-release
          test -f /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe
          echo 'd51a2a93e1fa469440120d6eb99cfddc7c33524b091e5c8aeaf0e954731c3d96  /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe' | sha256sum -c -
          test "$(stat -c%s /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe)" -eq 117761211
          file /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe | grep -q 'PE32'
      - name: Update existing public Windows download (no duplicate release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload cortex-idle-v0.1.0-halloween /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit cortex-idle-v0.1.0-halloween \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Cortex Idle Halloween Edition Windows x64 with left-aligned Phosphor SVG icons in the main menu, save management, and cooperative controls. Built from private ItsDeimox/cortex-idle commit 78cc034c027eda804f356350d0cb6a620d10aa99 (with later formatting-only commits). SHA-256: d51a2a93e1fa469440120d6eb99cfddc7c33524b091e5c8aeaf0e954731c3d96. Size: 117761211 bytes. No installer required."
          gh release view cortex-idle-v0.1.0-halloween --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "Cortex-Idle-0.1.0-Windows.exe") | .size'
