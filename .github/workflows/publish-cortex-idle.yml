name: Publish Cortex Idle Windows executable
on:
  push:
    branches: [cortex-idle-releases]
    paths: ['.github/workflows/publish-cortex-idle.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Cortex Idle artifact
        env:
          RELEASE_ARCHIVE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-c494-820e-886d-4bf75d5904f4/raw?se=2026-10-12T00%3A39%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=f4f0f0ba-ee95-5c80-9a3b-63ccfd6de359&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T12%3A39%3A37Z&ske=2026-10-12T12%3A39%3A37Z&sks=b&skv=2026-02-06&sig=jfdgVTRoXdI3bT3UHwpolKRbFvpeLPjWHksAej79ya0%3D'
        run: |
          curl --fail --location --show-error --retry 3 --retry-delay 2 "$RELEASE_ARCHIVE_URL" --output /tmp/cortex-idle-artifact.zip
          unzip -oq /tmp/cortex-idle-artifact.zip -d /tmp/cortex-idle-release
          test -f /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe
          echo 'f74ce14ca1e20c14256cc44bc99f94b0d23ba1ae7ce133f8361df2f519f43cbf  /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe' | sha256sum -c -
          test "$(stat -c%s /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe)" -eq 128673102
          file /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe | grep -q 'PE32'
      - name: Update existing public Windows download (no duplicate release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload cortex-idle-v0.1.0-halloween /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit cortex-idle-v0.1.0-halloween \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Cortex Idle portable Windows x64 with the 4D Hypercube visual theme, dimensional environment, glowing orthogonal circuit links, vertex detail and technical HUD. Original, Halloween, Voxel, Aurora and Amber remain selectable. Built from private ItsDeimox/cortex-idle runtime commit 264b434dfa281cd2e28fab938228c273368c16c5; source tests and browser validation through 39c51f8b8c8f79f3a549f4e0256142b305673858. SHA-256: f74ce14ca1e20c14256cc44bc99f94b0d23ba1ae7ce133f8361df2f519f43cbf. Size: 128673102 bytes. No installer required."
          gh release view cortex-idle-v0.1.0-halloween --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "Cortex-Idle-0.1.0-Windows.exe") | .size'
