name: Publish Cortex Idle Windows executable
on:
  push:
    branches: [cortex-idle-releases]
    paths: ['.github/workflows/publish-cortex-idle.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Cortex Idle artifact
        env:
          RELEASE_ARCHIVE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-51b4-820e-8041-61462ced58b1/raw?se=2026-10-11T00%3A43%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=401555aa-9b39-5156-9794-0c5205dc805c&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T13%3A06%3A14Z&ske=2026-10-11T13%3A06%3A14Z&sks=b&skv=2026-02-06&sig=776eQyZVCF2viiEsbXh6kwUOVs0ETpcPD4yoh5F64yo%3D'
        run: |
          curl --fail --location --show-error --retry 3 --retry-delay 2 "$RELEASE_ARCHIVE_URL" --output /tmp/cortex-idle-artifact.zip
          unzip -oq /tmp/cortex-idle-artifact.zip -d /tmp/cortex-idle-release
          test -f /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe
          echo '3aed332cc87d2b26b8d8207f3f52d5d2d424c8bc5d114dd24a8190103624fb0c  /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe' | sha256sum -c -
      - name: Publish public download asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create cortex-idle-v0.1.0-halloween /tmp/cortex-idle-release/Cortex-Idle-0.1.0-Windows.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cortex Idle 0.1.0 | Halloween Edition | Windows x64" \
            --notes "Cortex Idle Halloween Edition portable Windows x64 executable. Built from ItsDeimox/cortex-idle (private source). SHA256: 3aed332cc87d2b26b8d8207f3f52d5d2d424c8bc5d114dd24a8190103624fb0c. Requires no installer." \
            --latest=false
