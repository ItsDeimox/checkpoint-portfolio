name: DXRKTHS R38 restrained Low light mobile validation
on:
  push:
    branches: [dxrkths-r38-balanced-low]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: dxrkths
      - name: Build full DXRKTHS and run Node regression suite
        working-directory: dxrkths
        run: npm ci && npm run build
      - name: Install isolated Playwright runtime with system Chrome
        working-directory: dxrkths
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Record Low sharpness and verify lights, portal and High restoration
        working-directory: dxrkths
        env:
          DXT_QA_OUT: /tmp/dxt-r38/quality
        run: node tests/low-mobile-r37-browser.cjs
      # The first R38 candidate covered 270/275 mobile interactions without JS errors.
      # A third repeated High-quality tap exceeded the software GPU's 15s action
      # limit; the focused quality round-trip above verifies that operation.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dxrkths-r38-balanced-low-evidence
          path: /tmp/dxt-r38/
          retention-days: 7
